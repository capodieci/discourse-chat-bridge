# Everything else falls back to server.en.yml.
ru:
  chat_bridge:
    popup:
      title: "Вход в чат"
      signing_in: "Выполняется вход..."
      signed_in: "Вход выполнен. Это окно можно закрыть."
      signed_in_return: "Вход выполнен. Это окно можно закрыть и вернуться на страницу, с которой вы пришли."
      close: "Закрыть"
